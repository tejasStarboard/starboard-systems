# Merges open PRs into `dev` after the CI workflow succeeds.
# Used because GitHub Free private repos cannot enable branch protection /
# native auto-merge (requires Pro or public). This enforces “CI required
# before merge” for the default integration branch.
name: Automerge to dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  automerge:
    name: Merge PR into dev when CI passes
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find matching open PR targeting dev and merge
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const owner = context.repo.owner
            const repo = context.repo.repo
            const head = `${owner}:${run.head_branch}`

            core.info(`CI succeeded for ${head} @ ${run.head_sha}`)

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              per_page: 10,
            })

            const targets = pulls.filter(
              (pr) =>
                pr.base.ref === "dev" &&
                pr.head.sha === run.head_sha &&
                !pr.draft
            )

            if (targets.length === 0) {
              core.info(
                "No open non-draft PR into dev matching this CI head SHA; nothing to merge."
              )
              return
            }

            for (const pr of targets) {
              core.info(`Merging PR #${pr.number}: ${pr.title}`)
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: "merge",
                })
                core.info(`Merged PR #${pr.number}`)
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${pr.head.ref}`,
                  })
                  core.info(`Deleted branch ${pr.head.ref}`)
                } catch (err) {
                  core.warning(`Could not delete branch: ${err.message}`)
                }
              } catch (err) {
                core.setFailed(`Failed to merge PR #${pr.number}: ${err.message}`)
              }
            }
