name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which areas of the monorepo changed so later steps can skip
  # Bun/uv setup and Turbo can run only affected packages (+ dependents).
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.filters.outputs.quality }}
      web: ${{ steps.filters.outputs.web }}
      bun: ${{ steps.filters.outputs.bun }}
      python: ${{ steps.filters.outputs.python }}
      tooling: ${{ steps.filters.outputs.tooling }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              SHA="$BEFORE"
            else
              SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Comparing against $SHA"

      - name: Path filters
        id: filters
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            tooling:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.prettierrc'
              - '.prettierrc.*'
              - 'prettier.config.*'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
              - 'eslint.config.*'
              - '**/eslint.config.*'

            web:
              - 'apps/web/**'

            bun:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/database/**'
              - 'packages/email/**'
              - 'packages/pricing/**'
              - 'packages/service-kit/**'
              - 'packages/ui/**'
              - 'tooling/eslint-config/**'
              - 'tooling/typescript-config/**'
              - 'extensions/host/**'
              - 'services/crm/**'
              - 'services/geography/**'
              - 'services/quotes/**'
              - 'services/rates/**'

            python:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'packages/python-kit/**'
              - 'extensions/ingestion/**'
              - 'extensions/messaging/**'
              - 'extensions/spot/**'
              - 'extensions/temporal/**'

            quality:
              - 'apps/**'
              - 'packages/**'
              - 'tooling/**'
              - 'services/**'
              - 'extensions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.prettierrc'
              - '.prettierrc.*'
              - 'prettier.config.*'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
              - 'eslint.config.*'
              - '**/eslint.config.*'
              - 'pyproject.toml'
              - 'uv.lock'

  quality:
    name: Lint · typecheck · test · build
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy values so Next/t3 env validation succeeds in CI (no real secrets).
      CI: "true"
      POSTGRES_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-better-auth-secret-min-32-chars!!
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_DOMAIN: localhost
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      RESEND_API_KEY: re_ci_dummy_key
      EMAIL_SENDER_NAME: Starboard CI
      EMAIL_SENDER_ADDRESS: ci@example.com
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      QUOTES_SERVICE_URL: http://127.0.0.1:3102
      GEOGRAPHY_SERVICE_URL: http://127.0.0.1:3101
      CRM_SERVICE_URL: http://127.0.0.1:3103
      RATES_SERVICE_URL: http://127.0.0.1:3104
      INGESTION_SERVICE_URL: http://127.0.0.1:3201
      MESSAGING_SERVICE_URL: http://127.0.0.1:3202
      SPOT_SERVICE_URL: http://127.0.0.1:3203
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base_sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        if: needs.changes.outputs.bun == 'true' || needs.changes.outputs.tooling == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.tooling == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python workspace
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.tooling == 'true'
        run: uv sync --all-packages --group dev --frozen

      # Shared packages (contracts/db/ui/…) mark `bun` and may pull `web` into
      # turbo --affected even when apps/web itself did not change.
      - name: Write CI env for Next
        if: >
          needs.changes.outputs.web == 'true' ||
          needs.changes.outputs.bun == 'true' ||
          needs.changes.outputs.tooling == 'true'
        working-directory: apps/web
        run: |
          {
            echo 'POSTGRES_URL=postgresql://ci:ci@127.0.0.1:5432/ci'
            echo 'REDIS_URL=redis://127.0.0.1:6379'
            echo 'BETTER_AUTH_SECRET=ci-better-auth-secret-min-32-chars!!'
            echo 'BETTER_AUTH_URL=http://127.0.0.1:3000'
            echo 'BETTER_AUTH_DOMAIN=localhost'
            echo 'GOOGLE_CLIENT_ID=ci-google-client-id'
            echo 'GOOGLE_CLIENT_SECRET=ci-google-client-secret'
            echo 'RESEND_API_KEY=re_ci_dummy_key'
            echo 'EMAIL_SENDER_NAME=Starboard CI'
            echo 'EMAIL_SENDER_ADDRESS=ci@example.com'
            echo 'APP_URL=http://127.0.0.1:3000'
            echo 'NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000'
            echo 'QUOTES_SERVICE_URL=http://127.0.0.1:3102'
            echo 'GEOGRAPHY_SERVICE_URL=http://127.0.0.1:3101'
            echo 'CRM_SERVICE_URL=http://127.0.0.1:3103'
            echo 'RATES_SERVICE_URL=http://127.0.0.1:3104'
            echo 'INGESTION_SERVICE_URL=http://127.0.0.1:3201'
            echo 'MESSAGING_SERVICE_URL=http://127.0.0.1:3202'
            echo 'SPOT_SERVICE_URL=http://127.0.0.1:3203'
            echo 'INTERNAL_SERVICE_TOKEN=ci-internal-service-token'
          } > .env

      - name: Format check
        env:
          FULL: ${{ needs.changes.outputs.tooling }}
          BASE: ${{ needs.changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            pnpm format:check
            exit 0
          fi
          # Scoped prettier: only files in the PR/push diff (much faster than repo-wide).
          files="$(
            git diff --name-only --diff-filter=ACMRT "$BASE"...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.md' '*.css' \
              || true
          )"
          if [ -z "$files" ]; then
            echo "No formattable files in diff; skipping prettier."
            exit 0
          fi
          echo "Checking changed files with prettier:"
          echo "$files"
          echo "$files" | tr '\n' '\0' | xargs -0 pnpm exec prettier --check --

      - name: Lint · typecheck · test · build (affected)
        if: needs.changes.outputs.tooling != 'true'
        run: |
          set -euo pipefail
          echo "TURBO_SCM_BASE=$TURBO_SCM_BASE"
          echo "TURBO_SCM_HEAD=$TURBO_SCM_HEAD"
          pnpm exec turbo run lint typecheck test build --affected --summarize

      - name: Lint · typecheck · test · build (full — tooling change)
        if: needs.changes.outputs.tooling == 'true'
        run: |
          set -euo pipefail
          echo "Root/tooling change detected — running full workspace CI"
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  # Empty Postgres + drizzle-kit push catches schema drift (missing columns/tables)
  # before merge — same path as local `pnpm --filter @starboard/lib-db db:push`.
  db-schema:
    name: Push Drizzle schema
    needs: changes
    if: >
      needs.changes.outputs.bun == 'true' ||
      needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: "true"
      POSTGRES_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    services:
      postgres:
        # PostGIS required — geo.* uses geometry(MultiPolygon/Polygon,4326)
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema to CI Postgres
        run: pnpm --filter @starboard/lib-db db:push:ci

  # Keeps the workflow green for docs/ticket-only PRs so automerge can proceed
  # without running the heavy quality job.
  ci-gate:
    name: CI gate
    needs: [changes, quality, db-schema]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate required jobs
        run: |
          set -euo pipefail
          changes_result="${{ needs.changes.result }}"
          quality_result="${{ needs.quality.result }}"
          db_schema_result="${{ needs.db-schema.result }}"
          run_quality="${{ needs.changes.outputs.quality }}"
          run_db_schema="${{ needs.changes.outputs.bun == 'true' || needs.changes.outputs.tooling == 'true' }}"
          echo "changes=$changes_result quality_filter=$run_quality quality=$quality_result"
          echo "db_schema_filter=$run_db_schema db_schema=$db_schema_result"
          if [ "$changes_result" != "success" ]; then
            echo "Detect-changed-scopes job did not succeed"
            exit 1
          fi
          if [ "$run_quality" = "true" ]; then
            if [ "$quality_result" != "success" ]; then
              echo "Quality job did not succeed"
              exit 1
            fi
          else
            echo "No code/tooling changes — quality skipped (docs/tickets only)"
          fi
          if [ "$run_db_schema" = "true" ]; then
            if [ "$db_schema_result" != "success" ]; then
              echo "Push Drizzle schema job did not succeed"
              exit 1
            fi
          else
            echo "No bun/tooling changes — db-schema skipped"
          fi
