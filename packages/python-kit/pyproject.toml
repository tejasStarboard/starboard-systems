[project]
name = "starboard-lib-python-kit"
version = "0.0.1"
description = "Shared Python helpers for Starboard extension workers (HTTP, Temporal)."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "temporalio>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starboard_python_kit"]
