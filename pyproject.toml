[project]
name = "starboard-systems"
version = "0.0.1"
description = "Starboard Systems monorepo (Python workspace root)."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
# Python packages live under ./packages and ./services (alongside JS/Bun packages).
# Only directories with a pyproject.toml are workspace members; exclude JS/Bun trees.
members = ["packages/*", "services/*"]
exclude = [
  "packages/contracts",
  "packages/database",
  "packages/email",
  "packages/eslint-config",
  "packages/extension-host",
  "packages/pricing",
  "packages/service-kit",
  "packages/typescript-config",
  "packages/ui",
  "services/crm",
  "services/geography",
  "services/quotes",
  "services/rates",
  "services/temporal",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
