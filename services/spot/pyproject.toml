[project]
name = "starboard-spot"
version = "0.0.1"
description = "Starboard spot extension worker (Temporal OSS, carrier plugins)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.10.0",
  "temporalio>=1.9.0",
  "httpx>=0.28.0",
  "starboard-python-kit",
]

[project.scripts]
starboard-spot = "spot.main:run"
starboard-spot-worker = "spot.worker:main"
starboard-spot-dev = "spot.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spot"]

[tool.uv.sources]
starboard-python-kit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
