[project]
name = "starboard-messaging"
version = "0.0.1"
description = "Starboard messaging extension worker (Temporal OSS, MS Graph)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.10.0",
  "temporalio>=1.9.0",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "starboard-python-kit",
]

[project.scripts]
starboard-messaging = "messaging.main:run"
starboard-messaging-worker = "messaging.worker:main"
starboard-messaging-dev = "messaging.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging"]

[tool.uv.sources]
starboard-python-kit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
